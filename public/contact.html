<style>
  :root {
    --bg: #F6F2EA; --ink: #26301F; --ink-soft: #56604A;
    --green: #3E5C3A; --apricot: #D98C5F; --line: #DAD2C0;

  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1B2018; --ink: #EDE8DB; --ink-soft: #B7BBA9;
      --green: #8CB187; --apricot: #E3A377; --line: #3A4235;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1B2018; --ink: #EDE8DB; --ink-soft: #B7BBA9;
    --green: #8CB187; --apricot: #E3A377; --line: #3A4235;
  }
  html, body { margin: 0; background: var(--bg); }
  * { box-sizing: border-box; }
  body { font-family: 'Noto Sans JP', sans-serif; color: var(--ink); line-height: 1.85; overflow-x: hidden; }
  h1, h2, .brand { font-family: 'Shippori Mincho', serif; }
  a { color: inherit; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 24px; }

  header {
    padding: 16px 0; border-bottom: 1px solid var(--line);
    position: sticky; top: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 5;
  }
  header .wrap { display: flex; justify-content: space-between; align-items: center; }
  .brand { font-size: 18px; font-weight: 700; text-decoration: none; }
  .back { font-size: 13px; color: var(--ink-soft); text-decoration: none; }

  .article-head { padding: 48px 0 28px; border-bottom: 1px solid var(--line); }
  .tag { font-size: 12px; color: var(--apricot); margin-bottom: 14px; }
  h1 { font-size: 25px; line-height: 1.55; margin: 0 0 14px; max-width: 20ch; }
  .meta { font-size: 13px; color: var(--ink-soft); }

  p.lede { font-size: 15px; color: var(--ink-soft); padding: 28px 0 8px; max-width: 52ch; }

  section.block { padding: 26px 0; border-top: 1px solid var(--line); }
  section.block h2 { font-size: 18px; margin: 0 0 12px; }
  section.block p { font-size: 15px; margin: 0 0 12px; max-width: 56ch; }

  table { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 8px; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); }
  th { color: var(--ink-soft); font-weight: 500; }
  .tbl-wrap { overflow-x: auto; }

  .tips { padding: 30px 0; }
  .tips h2 { font-size: 18px; margin: 0 0 14px; }
  .tips ul { margin: 0; padding-left: 20px; font-size: 14px; color: var(--ink-soft); }
  .tips li { margin-bottom: 10px; }

  footer { padding: 32px 0 48px; border-top: 1px solid var(--line); }
  footer .small { font-size: 12px; color: var(--ink-soft); }

  @media (max-width: 560px) {
    h1 { font-size: 21px; }
  }
  .cards { display: grid; gap: 12px; margin: 24px 0 8px; }
  .cards a { display: block; border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; text-decoration: none; }
  .cards b { display: block; font-size: 16px; margin-bottom: 2px; }
  .cards span { font-size: 13px; color: var(--ink-soft); line-height: 1.7; }
  .warn { border: 1px solid var(--apricot); border-radius: 10px; padding: 14px 18px; margin: 20px 0; font-size: 14px; }
  .frm { margin: 24px 0 8px; }
  .frm label { display: block; font-size: 13px; color: var(--ink-soft); margin: 18px 0 6px; }
  .frm label small { color: var(--apricot); margin-left: 6px; }
  .frm input[type=text], .frm input[type=email], .frm select, .frm textarea { width: 100%; box-sizing: border-box; padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: inherit; font: inherit; font-size: 16px; }
  .frm textarea { min-height: 160px; resize: vertical; }
  .frm .agree { display: flex; gap: 10px; align-items: flex-start; margin: 20px 0; font-size: 13px; }
  .frm .agree input { margin-top: 4px; }
  .notice { display: none; border-left: 4px solid var(--apricot); padding: 4px 0 4px 16px; margin: 24px 0; }
  .notice.show { display: block; }
  .notice h2 { font-size: 18px; margin: 0 0 6px; }
  .notice p { margin: 0; font-size: 14px; color: var(--ink-soft); }
  .notice.error { border-left-color: #e5534b; }
  .frm button:disabled { opacity: .55; cursor: wait; }
  .frm button { display: block; width: 100%; min-height: 54px; border: 0; border-radius: 12px; background: var(--apricot); color: #0E1013; font: inherit; font-size: 16px; font-weight: 700; cursor: pointer; }
  .hp { position: absolute; left: -9999px; }
  dl.info { margin: 16px 0; }
  dl.info dt { font-size: 12px; color: var(--ink-soft); margin-top: 16px; }
  dl.info dd { margin: 2px 0 0; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
</style>

<header>

    <a class="brand" href="/">&amp;NUTRITION</a>
    <a class="back" href="/">← ホームへ</a>
  </div>
</header>

<div class="wrap">
  <div class="article-head">
    <div class="tag">お問い合わせ</div>
    <h1>お問い合わせ</h1>
    <div class="meta">記事の内容、誤りのご指摘、ご相談などを受け付けています。</div>
  </div>

  <p class="lede">下のフォームに、必要事項を入力して送信してください。</p>

  <div id="notice" class="notice" role="status" aria-live="polite" tabindex="-1"></div>

  <form class="frm" id="contact-form" method="POST" action="https://formspree.io/f/xyeklpng">
    <p class="hp" aria-hidden="true"><label>入力しないでください:<input name="_gotcha" tabindex="-1" autocomplete="off"></label></p>
    <label for="c-name">お名前<small>任意</small></label>
    <input type="text" id="c-name" name="name" autocomplete="name">
    <label for="c-email">メールアドレス<small>必須</small></label>
    <input type="email" id="c-email" name="email" required autocomplete="email">
    <label for="c-type">お問い合わせの種類</label>
    <select id="c-type" name="type">
      <option>記事の内容について</option>
      <option>誤りのご指摘</option>
      <option>サイトの使い方・不具合</option>
      <option>取材・協業のご相談</option>
      <option>その他</option>
    </select>
    <label for="c-msg">お問い合わせ内容<small>必須</small></label>
    <textarea id="c-msg" name="message" required></textarea>
    <div class="agree"><input type="checkbox" id="c-agree" name="agree" required><label for="c-agree" style="margin:0"><a href="/privacy">プライバシーポリシー</a>に同意します。</label></div>
    <button type="submit">送信する</button>
  </form>
  <section class="block">
    <h2>ご注意</h2>
    <p>・個別の病気の診断、治療、食事の指導には、お答えできません。主治医や管理栄養士にご相談ください。</p>
    <p>・お返事までに、お時間をいただくことがあります。内容によっては、お返事できない場合があります。</p>
  </section>


</div>

<footer>
  <div class="wrap">
    <nav class="flinks" aria-label="サイト情報"><a href="/about">運営者情報</a><a href="/contact">お問い合わせ</a><a href="/privacy">プライバシーポリシー</a><a href="/disclaimer">免責事項</a></nav>
    <div class="small">&copy; 2026 &amp;NUTRITION. All rights reserved.</div>
  </div>
</footer>

<script>
(function () {
  var form = document.getElementById('contact-form');
  var btn = form.querySelector('button[type=submit]');
  var notice = document.getElementById('notice');
  function show(kind, title, body) {
    notice.className = 'notice show' + (kind === 'error' ? ' error' : '');
    notice.innerHTML = '<h2></h2><p></p>';
    notice.querySelector('h2').textContent = title;
    notice.querySelector('p').textContent = body;
    notice.scrollIntoView({ behavior: 'smooth', block: 'start' });
    notice.focus({ preventScroll: true });
  }
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    btn.disabled = true;
    btn.textContent = '送信中…';
    fetch(form.action, { method: 'POST', body: new FormData(form), headers: { 'Accept': 'application/json' } })
      .then(function (res) {
        if (!res.ok) throw new Error('status ' + res.status);
        form.reset();
        form.style.display = 'none';
        show('ok', '送信を受け付けました', 'お問い合わせありがとうございます。内容を確認し、必要な場合はご入力いただいたメールアドレスにお返事します。');
      })
      .catch(function () {
        show('error', '送信できませんでした', '通信状況をご確認のうえ、もう一度お試しください。入力内容はそのまま残っています。');
      })
      .then(function () { btn.disabled = false; btn.textContent = '送信する'; });
  });
})();
</script>
